name: Validate module index

on:
  pull_request:
    paths:
      - "module-index.json"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - "module-index.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check JSON syntax
        run: python -c "import json;json.load(open('module-index.json',encoding='utf-8'))"

      - name: Validate entries against GitHub Releases
        run: python .github/scripts/validate_index.py --index module-index.json
